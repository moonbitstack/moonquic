name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # The two runs the library has no socket for: a peer harness in `integration/` puts its packets
  # on real datagrams, and another implementation answers. Neither run can pass by talking to
  # this library's own other end, which is the point of them.
  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: build the peer harness
        run: |
          cd integration
          moon build --target native

      # aioquic is pinned: 1.3.0 is the release the ticket and 0-RTT behaviour was read against.
      - name: install aioquic
        run: pip install --break-system-packages "aioquic==1.3.0" cryptography

      - name: early data is read by aioquic before its handshake finishes
        run: python3 scripts/quic/check_aioquic_early_data.py

      # picoquic at a fixed commit, built from source: its multipath extension is a draft, and a
      # moving target would make a red run say nothing about this repository. RelWithDebInfo is
      # not a preference: the demo server segfaults in picoquic_create_packet_header when built
      # at its default Release (-O3), preparing a packet for the second path.
      - name: build picoquic
        run: |
          git clone https://github.com/private-octopus/picoquic.git
          cd picoquic
          git checkout 7fa9c85e7b60c3fe44849ede8ec1f2e30502155c
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPICOQUIC_FETCH_PTLS=ON -Dpicoquic_BUILD_TESTS=OFF \
            -DBUILD_PICO_SIM=OFF -DBUILD_PQBENCH=OFF
          cmake --build build -j $(nproc) --target picoquicdemo

      - name: two paths against picoquic, with a PATH_ACK each way
        run: python3 scripts/quic/check_picoquic_multipath.py --picoquic picoquic/build/picoquicdemo

      # Version 2 and version negotiation, both directions. The peer is quic-go: a version of it
      # is pinned in `integration/quic-go-peer/go.mod`, so a run says something about this
      # repository rather than about the day it ran.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: integration/quic-go-peer/go.sum

      - name: build the quic-go peer
        run: |
          cd integration/quic-go-peer
          go build -o "$RUNNER_TEMP/quic-go-peer" .

      - name: version 1 and version 2, both directions, with the default key share
        run: |
          client=$(find . -name "client*" -path "*moonquic-integration/client/*" -type f -perm -u+x | head -1)
          server=$(find . -name "server*" -path "*moonquic-integration/server/*" -type f -perm -u+x | head -1)
          python3 scripts/quic/check_versions.py \
            --peer "$RUNNER_TEMP/quic-go-peer" --client "$client" --server "$server"

      # ngtcp2 at a fixed tag, built from source: its example client speaks HTTP/0.9 over QUIC,
      # which is the closest thing it ships to a stream this repository can answer.
      - name: build ngtcp2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev libnghttp3-dev libnghttp2-dev libev-dev pkg-config
          git clone -q --depth 1 -b v1.16.0 https://github.com/ngtcp2/ngtcp2.git
          cd ngtcp2
          # The example links a vendored URL parser, which is a submodule.
          git submodule update --init --depth 1 third-party/urlparse
          cmake -B build -DENABLE_OPENSSL=ON -DENABLE_GNUTLS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF
          cmake --build build -j $(nproc) --target osslclient

      # ngtcp2's examples are HTTP/3 servers, so the reverse direction needs a peer of our own:
      # a small server on ngtcp2_conn_server_new that echoes a raw bidirectional stream under
      # whatever ALPN the client offers. See integration/ngtcp2-peer/server.c.
      - name: build the raw-stream ngtcp2 peer
        run: make -C integration/ngtcp2-peer NGTCP2="$PWD/ngtcp2"

      - name: ngtcp2 in both directions, in both versions
        run: |
          client=$(find . -name "client*" -path "*moonquic-integration/client/*" -type f -perm -u+x | head -1)
          server=$(find . -name "server*" -path "*moonquic-integration/server/*" -type f -perm -u+x | head -1)
          python3 scripts/quic/check_ngtcp2.py \
            --client ngtcp2/build/examples/osslclient --server "$server" \
            --raw-server integration/ngtcp2-peer/peer --our-client "$client"
